# ==============================================================================
# Mandi+ Platform - Backend Configuration

# ==============================================================================

# Server Port (Render uses $PORT)
server.port=${PORT:${SERVER_PORT:8082}}

# Optional local overrides (.env or application-local.properties if present)
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties],optional:file:application-local.properties,optional:file:../application-local.properties

# Database Configuration (Externalized credentials)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mandiplus_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configurations (Externalized; must be provided via JWT_SECRET)
mandiplus.jwt.secret=${JWT_SECRET:}
mandiplus.jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}

# File Upload Settings (for photos, audio voice notes, and videos)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Razorpay Payment Gateway Configuration (Externalized credentials)
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}

# Government Mandi API Configuration (data.gov.in)
gov.mandi.api.key=${DATA_GOV_IN_API_KEY:}
gov.mandi.api.resource-id=${GOV_MANDI_RESOURCE_ID:9ef84268-d588-465a-a308-a864a43d0070}
gov.mandi.api.base-url=${GOV_MANDI_BASE_URL:https://api.data.gov.in/resource}
gov.mandi.api.default-state=${GOV_MANDI_DEFAULT_STATE:Maharashtra}

# Firebase Configuration
firebase.project-id=${FIREBASE_PROJECT_ID:${VITE_FIREBASE_PROJECT_ID:mandiplus}}
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}

# SMS OTP Authentication Configuration (Indian SMS Gateway)
mandiplus.otp.provider=${MANDIPLUS_OTP_PROVIDER:fast2sms}
mandiplus.otp.api-key=${MANDIPLUS_OTP_API_KEY:}
mandiplus.otp.expiry-seconds=300
mandiplus.otp.cooldown-seconds=60
mandiplus.otp.max-attempts=3
mandiplus.otp.rate-limit-per-hour=5
openweather.api.key=${OPENWEATHER_API_KEY:}
